name: columnpilot

services:
  columnpilot:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: ${COLUMNPILOT_IMAGE:-columnpilot:0.4.0}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      COLUMNPILOT_ALLOW_PRIVATE_TARGETS: "true"
    ports:
      - "${COLUMNPILOT_BIND_ADDRESS:-127.0.0.1}:${COLUMNPILOT_PORT:-3000}:3000"
    depends_on:
      clickhouse:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/.next/cache:size=128m,uid=1001,gid=1001,mode=0755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/api/health')
          .then((response) => { if (!response.ok) process.exit(1) })
          .catch(() => process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  clickhouse:
    image: clickhouse:26.8.6.5
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-columnpilot}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-columnpilot}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-columnpilot_dev}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "127.0.0.1:${CLICKHOUSE_NATIVE_PORT:-19000}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
      - ./infra/clickhouse/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          clickhouse-client
          --user "$${CLICKHOUSE_USER}"
          --password "$${CLICKHOUSE_PASSWORD}"
          --query "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

volumes:
  clickhouse_data:
  clickhouse_logs:
