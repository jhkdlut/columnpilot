version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Hong_Kong
    open-pull-requests-limit: 5
    # Keep the validated toolchain until plugin support is reviewed explicitly.
    ignore:
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      framework:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react", "@types/react-dom"]
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies

  - package-ecosystem: docker
    directory: /
    # Docker, CI and @types/node stay on Node 22 together.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Asia/Hong_Kong
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
      - docker

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Hong_Kong
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
      - github-actions
